name: Class Reminder (Morning Agent + Telegram)

# Runs every morning at ~07:00 TR time. Reads today's classes from
# CLASS-SCHEDULE.md and the exam countdown from EXAM-TRACKER.md, has
# Claude Code summarize it, and sends it to Telegram.
# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 4 * * *"   # UTC 04:00 = ~07:00 TR time (UTC+3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sabah-hatirlatma:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Calculate midterm/final countdown
        id: countdown
        run: |
          python3 -c "
          import re
          from datetime import date

          today = date.today()
          out_lines = []
          try:
              with open('EXAM-TRACKER.md', encoding='utf-8') as f:
                  content = f.read()
          except FileNotFoundError:
              content = ''

          for line in content.splitlines():
              line = line.strip()
              if not line.startswith('|'):
                  continue
              cols = [c.strip() for c in line.strip('|').split('|')]
              if len(cols) < 2:
                  continue
              m = re.match(r'(\d{4})-(\d{2})-(\d{2})', cols[0])
              if not m:
                  continue
              y, mo, d = map(int, m.groups())
              try:
                  exam_date = date(y, mo, d)
              except ValueError:
                  continue
              days_left = (exam_date - today).days
              ders = cols[1] if len(cols) > 1 else '?'
              tur = cols[2] if len(cols) > 2 else ''
              if days_left < 0:
                  durum = f'{ders} {tur} - passed ({exam_date.isoformat()})'
              elif days_left == 0:
                  durum = f'{ders} {tur} - TODAY! ({exam_date.isoformat()})'
              else:
                  durum = f'{ders} {tur} - {days_left} days left ({exam_date.isoformat()})'
              out_lines.append(durum)

          result = '\n'.join(out_lines) if out_lines else 'No exam dates recorded (EXAM-TRACKER.md is empty).'
          with open('countdown.txt', 'w', encoding='utf-8') as f:
              f.write(result)
          print(result)
          "

      - name: Determine today's day name
        id: bugun
        run: |
          echo "GUN=$(TZ='Europe/Istanbul' date +%A)" >> "$GITHUB_ENV"
          echo "TARIH=$(TZ='Europe/Istanbul' date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Generate morning summary with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          Below is a 3rd-year chemical engineering student's
          weekly class schedule, today's date/day, and the number of days
          left until each exam. Prepare a short and clear MORNING SUMMARY
          in English:

          1. List today's (${GUN}, ${TARIH}) classes in chronological order.
             Find the rows in CLASS-SCHEDULE.md that match today's day.
             If there are no classes today, state that.
          2. Take the number of days left until each exam from the
             calculation below, and especially highlight exams with 7 days
             or fewer left (something like a 'start preparing' warning).
          3. If there's a topic related to today's classes that needs quick
             preparation (e.g. if a class covered today is within the scope
             of an upcoming exam), mention that as well.

          Class Schedule (CLASS-SCHEDULE.md):
          $(cat CLASS-SCHEDULE.md)

          Exam Countdown:
          $(cat countdown.txt)

          Keep your answer as plain text, lively but short, using emoji
          (at most 10-12 lines). You may use a heading and bullet points.
          Do NOT use a Markdown table, use a plain list instead (this will
          be a Telegram message).

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > sabah-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "ders-agent-bot"
          git config user.email "ders-agent-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Extract summary and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(python3 -c "
          import json
          try:
              with open('sabah-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:1500]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:1500]
              print(text[:1500])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="☀️ *Morning Class Reminder — ${TARIH} (${GUN})*

          $SUMMARY"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
