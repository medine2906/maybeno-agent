name: Daily Review (Evening Quiz Agent + Telegram)

# Runs every evening at ~20:00 TR time. Generates 3-5 reinforcement
# questions from today's topics in DAILY-TOPICS.md, and sends the answer
# key in a separate ("spoiler") section of the same message.
# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 17 * * *"   # UTC 17:00 = ~20:00 TR time (UTC+3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aksam-pekistirme:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Determine date
        run: |
          echo "TARIH=$(TZ='Europe/Istanbul' date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Generate reinforcement quiz with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          Below is the content of a 3rd-year chemical
          engineering student's DAILY-TOPICS.md file. Look at the notes for
          the topmost (most recent) day in this file — today's date is
          ${TARIH}. If there is no entry for today, use the topics from the
          most recently recorded day instead, and mention this.

          Prepare 3 to 5 REINFORCEMENT QUESTIONS from that day's topics
          (short-answer or conceptual, appropriate for a 3rd-year chemical
          engineering level). Then give the output in EXACTLY this format:

          🧠 *Today's Reinforcement Questions*
          (topic: ...)

          1. Question...
          2. Question...
          3. Question...
          (4th and 5th if applicable)

          🔽🔽🔽 Think before you see the answers! 🔽🔽🔽
          .
          .
          .
          .
          .
          🔑 *Answer Key*
          1. Answer...
          2. Answer...
          3. Answer...
          (4th and 5th if applicable)

          Do not deviate from the format, do not add extra explanation. Use
          plain text (this will be a Telegram message), do not use a
          Markdown table.

          DAILY-TOPICS.md content:
          $(cat DAILY-TOPICS.md)

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > aksam-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "ders-agent-bot"
          git config user.email "ders-agent-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Extract quiz and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          QUIZ=$(python3 -c "
          import json
          try:
              with open('aksam-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:2000]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:2000]
              print(text[:2000])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="📘 *Evening Review — ${TARIH}*

          $QUIZ"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
