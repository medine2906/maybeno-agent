name: Weekly Lesson - Software Teacher Agent (Claude Code + Telegram)

# Runs twice a week (Tuesday and Friday). Picks the next "Pending" row from
# PROJECTS-TO-LEARN.md, clones the repo if accessible, examines the code,
# prepares a "lesson", and sends it to Telegram.
# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 6 * * 2"   # UTC 06:00 Tuesday = ~09:00 Turkey time
    - cron: "0 6 * * 5"   # UTC 06:00 Friday = ~09:00 Turkey time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ders-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git user info
        run: |
          git config user.name "haftalik-ders-bot"
          git config user.email "haftalik-ders-bot@users.noreply.github.com"

      - name: Find next project
        id: pick
        run: |
          python3 -c "
          import re

          with open('PROJECTS-TO-LEARN.md', encoding='utf-8') as f:
              lines = f.readlines()

          picked = None
          for i, line in enumerate(lines):
              if not line.strip().startswith('|'):
                  continue
              cells = [c.strip() for c in line.strip().strip('|').split('|')]
              if len(cells) < 3:
                  continue
              if cells[0].lower() in ('repo link', '---') or set(cells[0]) <= {'-'}:
                  continue
              if cells[2] == 'Pending':
                  picked = (i, cells[0], cells[1])
                  break

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              if picked:
                  idx, repo_link, topic = picked
                  out.write('found=true\n')
                  out.write(f'row_index={idx}\n')
                  out.write(f'repo_link={repo_link}\n')
                  out.write(f'topic={topic}\n')
              else:
                  out.write('found=false\n')
          "

      - name: No project to process - notify Telegram and exit
        if: steps.pick.outputs.found != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="📚 *Weekly Lesson Agent*

          No project with 'Pending' status was found in PROJECTS-TO-LEARN.md. Don't forget to add a new row."

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"

      - name: Set status to In Progress and commit
        if: steps.pick.outputs.found == 'true'
        run: |
          python3 -c "
          idx = ${{ steps.pick.outputs.row_index }}
          with open('PROJECTS-TO-LEARN.md', encoding='utf-8') as f:
              lines = f.readlines()
          cells = [c.strip() for c in lines[idx].strip().strip('|').split('|')]
          cells[2] = 'In Progress'
          lines[idx] = '| ' + ' | '.join(cells) + ' |\n'
          with open('PROJECTS-TO-LEARN.md', 'w', encoding='utf-8') as f:
              f.writelines(lines)
          "
          git add PROJECTS-TO-LEARN.md
          git commit -m "Weekly lesson: in progress - ${{ steps.pick.outputs.repo_link }}" || true
          git push origin HEAD:main || true

      - name: Try to clone the target repo
        if: steps.pick.outputs.found == 'true'
        id: clone
        run: |
          mkdir -p /tmp/hedef-repo
          if git clone --depth 1 "${{ steps.pick.outputs.repo_link }}" /tmp/hedef-repo 2>/tmp/clone-error.log; then
            echo "accessible=true" >> "$GITHUB_OUTPUT"
          else
            echo "accessible=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clone-error.log || true
          fi

      - name: Mark as Unreachable and notify Telegram
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          idx = ${{ steps.pick.outputs.row_index }}
          with open('PROJECTS-TO-LEARN.md', encoding='utf-8') as f:
              lines = f.readlines()
          cells = [c.strip() for c in lines[idx].strip().strip('|').split('|')]
          cells[2] = 'Unreachable'
          lines[idx] = '| ' + ' | '.join(cells) + ' |\n'
          with open('PROJECTS-TO-LEARN.md', 'w', encoding='utf-8') as f:
              f.writelines(lines)
          "
          git add PROJECTS-TO-LEARN.md
          git commit -m "Weekly lesson: unreachable - ${{ steps.pick.outputs.repo_link }}" || true
          git push origin HEAD:main || true

          MESSAGE="📚 *Weekly Lesson Agent*

          ⚠️ Could not access repo: ${{ steps.pick.outputs.repo_link }}
          The repo may be private or the link may be wrong. Please check it."

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"

      - name: Prepare the lesson with Claude Code
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          Examine the following repo: /tmp/hedef-repo
          The user specifically wants to learn about: '${{ steps.pick.outputs.topic }}'

          Read the code files, analyze the relevant part, and prepare a
          'lesson' for the user in a friendly, instructive English tone.
          The lesson MUST be written under exactly these 4 headings, in
          order, and clearly labeled:

          1. Overview — what this code does
          2. Core concept/technology — what it is and why it was used
          3. Analogy — explanation using a simple analogy
          4. Exercise — a small exercise the user can try on their own

          Break the topic into small, digestible pieces; don't write in an
          overly long or academic style — explain it clearly and simply,
          as if talking to a friend. Your entire response should be this
          lesson text.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > haftalik-ders-log.json || true

      - name: Bellek dosyalarını commit'le
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible == 'true'
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Set status to Completed and commit
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible == 'true'
        run: |
          python3 -c "
          idx = ${{ steps.pick.outputs.row_index }}
          with open('PROJECTS-TO-LEARN.md', encoding='utf-8') as f:
              lines = f.readlines()
          cells = [c.strip() for c in lines[idx].strip().strip('|').split('|')]
          cells[2] = 'Completed'
          lines[idx] = '| ' + ' | '.join(cells) + ' |\n'
          with open('PROJECTS-TO-LEARN.md', 'w', encoding='utf-8') as f:
              f.writelines(lines)
          "
          git add PROJECTS-TO-LEARN.md
          git commit -m "Weekly lesson: completed - ${{ steps.pick.outputs.repo_link }}" || true
          git push origin HEAD:main || true

      - name: Store the log file
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haftalik-ders-log-${{ github.run_id }}
          path: haftalik-ders-log.json

      - name: Send the lesson to Telegram
        if: steps.pick.outputs.found == 'true' && steps.clone.outputs.accessible == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DERS=$(python3 -c "
          import json
          try:
              with open('haftalik-ders-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:3500]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:3500]
              print(text[:3800])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="📚 *Weekly Lesson — ${{ steps.pick.outputs.repo_link }}*
          Topic: ${{ steps.pick.outputs.topic }}

          $DERS"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
