name: Industry Info - Software Teacher Agent (Claude Code + Telegram)

# Runs twice a month (the 1st and 15th). Extracts the technologies the
# user is learning from the history in PROJECTS-TO-LEARN.md (the
# Completed rows), summarizes their use in the industry (which companies
# use them, career relevance) and sends it to Telegram.
#
# NOTE: This task requires web search (for up-to-date company/industry
# info). The claude -p call asks the CLI to use its WebSearch tool if it
# has one/it's enabled; depending on the CLI version WebSearch may be
# enabled automatically or may require an extra flag/permission — check
# the Claude Code docs.
# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 7 1 * *"    # UTC 07:00, the 1st of the month
    - cron: "0 7 15 * *"   # UTC 07:00, the 15th of the month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sektor-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build the list of completed topics/technologies
        id: gecmis
        run: |
          python3 -c "
          import os
          rows = []
          with open('PROJECTS-TO-LEARN.md', encoding='utf-8') as f:
              for line in f:
                  if not line.strip().startswith('|'):
                      continue
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if len(cells) < 3:
                      continue
                  if cells[0].lower() in ('repo link',) or set(cells[0]) <= {'-'}:
                      continue
                  if cells[2] == 'Completed':
                      rows.append(f'{cells[0]} — {cells[1]}')

          summary = chr(10).join(rows) if rows else '(no completed lessons yet)'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('GECMIS<<EOF\n')
              out.write(summary + '\n')
              out.write('EOF\n')
          "

      - name: Prepare the industry summary with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          The user has learned or is learning the following
          projects/topics (from the PROJECTS-TO-LEARN.md history, format:
          'repo — topic'):

          ${{ steps.gecmis.outputs.GECMIS }}

          Extract the concepts/technologies learned from these rows
          (language, framework, architectural pattern, tool, etc.). If
          possible, use the WebSearch tool to base this on current
          information; if the tool isn't available, use your best general
          knowledge and make your best estimate, noting that you did so.
          In English, briefly and instructively summarize:

          - Which companies/products in the industry use these technologies
          - What the career relevance/demand for these technologies is
          - A short suggestion on which direction the user should go deeper next

          Your answer will be sent as a Telegram message, so keep it from
          being too long — write it in bullet points and keep it readable.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > sektor-bilgisi-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "sektor-bilgisi-bot"
          git config user.email "sektor-bilgisi-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Store the log file
        uses: actions/upload-artifact@v4
        with:
          name: sektor-bilgisi-log-${{ github.run_id }}
          path: sektor-bilgisi-log.json

      - name: Send the summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OZET=$(python3 -c "
          import json
          try:
              with open('sektor-bilgisi-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:3500]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:3500]
              print(text[:3800])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="🏢 *Industry Info Report*
          $(date +%Y-%m-%d)

          $OZET"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
