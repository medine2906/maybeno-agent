name: Gece Agent - Proje Yönetimi (Claude Code + Telegram Rapor)

# Bu dosyayı her proje repo'sunda .github/workflows/night-agent.yml olarak kaydet.
# Gerekli secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = TR saatiyle ~03:00
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code CLI kur
        run: npm install -g @anthropic-ai/claude-code

      - name: Çalışma branch'i oluştur
        run: |
          BRANCH="night-agent/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "night-agent-bot"
          git config user.email "night-agent-bot@users.noreply.github.com"

      - name: Claude Code'u çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce anayasa.md dosyasını oku ve kurallarına uy. Sonra KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          $(cat TASKS.md)

          İşin sonunda mutlaka kısa bir özet yaz (en fazla 5-6 madde):
          - Ne yapıldı
          - Ne yapılamadı / neden
          - Onay bekleyen kararlar
          Bu özeti 'ÖZET:' başlığıyla ayrı bir bölümde ver.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > night-agent-log.json || true

      - name: Bellek dosyalarını commit'le
        # Anayasa.md §3'e göre bellek dosyaları (HATA-DEFTERI.md, SKILLS.md,
        # hata-arsivi/) PR beklemeden doğrudan main'e gidebilir.
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Değişiklikleri commit'le
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Gece agent: otomatik güncelleme $(date +%Y-%m-%d)"

      - name: Değişiklik var mı kontrol et
        id: check-changes
        run: |
          if git diff --quiet origin/main "$BRANCH" -- 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch'i push'la
        if: steps.check-changes.outputs.changed == 'true'
        run: git push origin "$BRANCH"

      - name: Pull Request aç
        if: steps.check-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Gece Agent - ${{ github.event.repository.name }} - $(date +%Y-%m-%d)" \
            --body "Otomatik gece agent PR'ı. Detaylar için Actions log'una bak." \
            --base main \
            --head "$BRANCH" || echo "PR açılamadı (belki zaten var)"

      - name: Log dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: night-agent-log-${{ github.run_id }}
          path: night-agent-log.json

      - name: Özeti çıkar ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPO="${{ github.event.repository.name }}"
          CHANGED="${{ steps.check-changes.outputs.changed }}"

          SUMMARY=$(python3 -c "
          import json
          try:
              with open('night-agent-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:1000]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:1000]
              print(text[:1200])
          except Exception as e:
              print(f'Log okunamadı: {e}')
          ")

          if [ "$CHANGED" = "true" ]; then
            STATUS="✅ Değişiklik yapıldı, PR açıldı"
          else
            STATUS="ℹ️ Bu gece değişiklik yapılmadı"
          fi

          MESSAGE="🌙 *Gece Agent Raporu — $REPO*
          $(date +%Y-%m-%d)

          $STATUS

          $SUMMARY"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
