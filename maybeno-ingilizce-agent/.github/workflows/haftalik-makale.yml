name: Weekly Reading Suggestion (Claude Code + Telegram)

# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# IMPORTANT: For copyright reasons, this workflow does NOT generate or copy the actual TEXT
# of an article. It only generates a TOPIC/TITLE SUGGESTION suited to the user's interests
# (LEVEL.md); the user then searches for and reads an article on that topic themselves. It
# also prepares discussion/comprehension questions about that topic.

on:
  schedule:
    - cron: "0 6 * * 1"   # UTC Monday 06:00 = Monday 09:00 Turkey time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  haftalik-oneri:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          The user's English level and interests are in the LEVEL.md file below
          (pay particular attention to AI / technology / software interests).

          IMPORTANT RULE: NEVER generate, quote, or fabricate the TEXT of an actual article, news
          story, or any copyrighted content. Do not act as if you are quoting from an article that
          doesn't exist. Instead, only prepare a READING TASK SUGGESTION: suggest a TOPIC/TITLE
          suited for the user to read this week (example: 'This week, look for and read a recent
          English article/blog post about AI agents — for example on sources like TechCrunch, The
          Verge, Ars Technica, or the OpenAI/Anthropic blog') and ask the user to find and read a
          source themselves.

          Prepare a plain-text message to be sent to Telegram (do not use a # heading mark, keep it
          not too long, roughly 150-200 words), consisting of the following sections:

          1) THIS WEEK'S READING SUGGESTION: Suggest a topic/title suited to the user's interests
          (AI, technology-focused) and give 2-3 source/site names for where to look. Do not write
          the actual text of an article, just state the topic and where to look for it.

          2) DISCUSSION QUESTIONS: Prepare 3-4 discussion questions for the user to think/write
          about in English regarding this topic (questions in English, a short Turkish translation
          may be added in parentheses).

          3) TARGET VOCABULARY: List 4-5 technical/AI terms the user will likely encounter on this
          topic, along with their short Turkish equivalents.

          File contents:
          ---
          $(cat LEVEL.md)
          ---

          Only produce the content of the Telegram message, do not add any other explanation.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > haftalik-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "ingilizce-agent-bot"
          git config user.email "ingilizce-agent-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Store log file
        uses: actions/upload-artifact@v4
        with:
          name: haftalik-oneri-log-${{ github.run_id }}
          path: haftalik-log.json

      - name: Extract content and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CONTENT=$(python3 -c "
          import json
          try:
              with open('haftalik-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:3000]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:3000]
              print(text[:3500])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="📰 Weekly Reading Suggestion — $(date +%Y-%m-%d)

          $CONTENT"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE"
