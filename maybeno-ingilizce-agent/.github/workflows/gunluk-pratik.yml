name: Daily English Practice (Claude Code + Telegram)

# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Generates a daily English practice message based on the information in LEVEL.md
# and sends it to Telegram. Makes no changes to the code repository.

on:
  schedule:
    - cron: "0 5 * * *"   # UTC 05:00 = 08:00 Turkey time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gunluk-pratik:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          Below is the user's English level and focus areas (LEVEL.md file).
          Based on this, prepare a short English practice message for today. The message will be
          sent to Telegram, so write it as plain text (you may use a single asterisk/underscore for
          markdown bold/italic, but do not use a # heading mark), mix the English content with
          Turkish explanations, and keep the total length not too long (roughly 150-250 words).

          The content should consist of the following sections:

          1) WORD/PHRASE OF THE DAY: An English word or phrase, its meaning (in Turkish), and an
          example sentence. If possible, choose one suited to the user's focus area (e.g.
          software/AI/academic).

          2) SHORT READING PASSAGE: An original (written by you, not quoted from another source)
          short English paragraph of 3-5 sentences, suited to the user's level. Follow it with 2
          comprehension questions about the passage (in English, short answers).

          3) GRAMMAR POINT: A short grammar topic, a 2-3 sentence explanation (may be in Turkish),
          and at least 1 example sentence.

          File contents:
          ---
          $(cat LEVEL.md)
          ---

          Only produce the content of the Telegram message, do not add any other explanation.
          Give your answer directly as the message text, without a heading like 'MESSAGE:' at the
          start.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > gunluk-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "ingilizce-agent-bot"
          git config user.email "ingilizce-agent-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Store log file
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-pratik-log-${{ github.run_id }}
          path: gunluk-log.json

      - name: Extract content and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CONTENT=$(python3 -c "
          import json
          try:
              with open('gunluk-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:3000]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:3000]
              print(text[:3500])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="📚 Daily English Practice — $(date +%Y-%m-%d)

          $CONTENT"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE"
