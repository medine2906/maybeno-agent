name: Competition Tracker Agent (Claude Code + Telegram Report)

# This workflow runs once a week. It summarizes the overall status of
# COMPETITION-POOL.md: how many applications were submitted, how many are still
# awaiting results, and what upcoming deadlines are coming up. It does not modify
# any file, it only sends a report.
#
# Required secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 8 * * 1"   # UTC Monday 08:00 = ~11:00 Turkey time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cetele:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Önce repo kökündeki anayasa.md dosyasını oku ve kurallarına uy. Sonra bu klasördeki KIMLIK.md dosyanı oku (kim olduğun, tonun, sınırların). Sonra HATA-DEFTERI.md dosyanı oku — geçmişte çıkardığın dersleri tekrar etme. Sonra SKILLS.md dosyanı oku, varsa faydalı bulduğun bir yöntemi uygula.

          Şimdi asıl görevin:

          Read COMPETITION-POOL.md and prepare a weekly tracker/summary
          report. Don't change any file, only analyze and report. The report should
          include:
          - Total number of competitions being tracked
          - Status breakdown: how many are Evaluating / Good Fit / Not a Fit / Applied
            / Resolved
          - Of the competitions with status 'Applied', how many are still awaiting a
            result
          - Upcoming application deadlines (list the ones falling within the next 30
            days from today, sorted by date; which competition, which date, which
            status)
          - If there are competitions whose deadline has passed but are still stuck in
            'Evaluating' or 'Good Fit' status (likely missed), call them out
            specifically

          At the end of the task, always give the summary under the heading
          'SUMMARY:', short and readable, in bullet points.

          İşin bitiminde: Bu çalışmadan çıkardığın YENİ bir ders veya fark ettiğin bir hata varsa, HATA-DEFTERI.md dosyasının sonuna anayasa.md §4'teki formatla (## YYYY-MM-DD başlığı, 'Ne oldu' ve 'Ders' maddeleri) ekle; yoksa dosyaya dokunma. HATA-DEFTERI.md ~200 satırı geçtiyse eski kısmı özetleyip hata-arsivi/YYYY-MM.md dosyasına taşı ve ana dosyada özet + güncel kısmı bırak. Tekrar eden faydalı bir yöntem keşfettiysen SKILLS.md'ye kısaca ekle." \
            --dangerously-skip-permissions \
            --output-format json > cetele-log.json || true

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "yarisma-agent-bot"
          git config user.email "yarisma-agent-bot@users.noreply.github.com"

      - name: Bellek dosyalarını commit'le
        run: |
          git add HATA-DEFTERI.md SKILLS.md hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Ajan hafizasi guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Store log file
        uses: actions/upload-artifact@v4
        with:
          name: cetele-log-${{ github.run_id }}
          path: cetele-log.json

      - name: Extract summary and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(python3 -c "
          import json
          try:
              with open('cetele-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:1500]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:1500]
              print(text[:1800])
          except Exception as e:
              print(f'Could not read log: {e}')
          ")

          MESSAGE="📋 *Weekly Competition Tracker*
          $(date +%Y-%m-%d)

          $SUMMARY"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
