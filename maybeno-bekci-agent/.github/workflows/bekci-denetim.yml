name: Bekci Denetimi (Tum Ajanlari Anayasaya Gore Kontrol Et)

# Haftalik calisir. Bekci, repodaki tum kardes ajan klasorlerini
# anayasa.md'ye uygunluk ve hafiza dosyasi sagligi acisindan denetler,
# tek bir Telegram raporu gonderir. Sadece kendi bellek dosyalarina
# (HATA-DEFTERI.md, SKILLS.md, hata-arsivi/*) yazar.
# Gerekli secrets: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 7 * * 1"   # Her Pazartesi UTC 07:00 (TR ~10:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bekci-denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code CLI kur
        run: npm install -g @anthropic-ai/claude-code

      - name: Git kullanıcı bilgisi ayarla
        run: |
          git config user.name "bekci-agent-bot"
          git config user.email "bekci-agent-bot@users.noreply.github.com"

      - name: Bekçi denetimini çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Sen maybeno-bekci-agent'sın. Sırayla şunu yap:

          1. Önce repo kökündeki anayasa.md dosyasını oku.
          2. Sonra maybeno-bekci-agent/KIMLIK.md dosyanı oku.
          3. Sonra maybeno-bekci-agent/HATA-DEFTERI.md dosyanı oku.
          4. Sonra maybeno-bekci-agent/SKILLS.md dosyanı oku.
          5. Önce repo kökünün kendisini bir ajan olarak denetle (KIMLIK.md,
             HATA-DEFTERI.md, SKILLS.md, hata-arsivi/ kök dizinde). Sonra
             repo kökünde maybeno- ile başlayan her klasör için (kendi
             klasörün maybeno-bekci-agent hariç):
             - KIMLIK.md, HATA-DEFTERI.md, SKILLS.md, hata-arsivi/
               dosya/klasörleri var mı kontrol et, eksikse not al.
             - HATA-DEFTERI.md kaç satır, ~200 satırı geçmiş mi ve
               anayasa.md §4'teki rotasyon yapılmış mı kontrol et.
             - git log --oneline -20 -- <klasör> ile son commit'lere
               bak, main'e bellek-dışı bir dosyanın (kod/README/workflow)
               doğrudan commit edilip edilmediğine dair şüpheli bir emare
               var mı bak (kesin PR geçmişini bilemeyebilirsin, sadece
               commit mesajlarından makul bir çıkarım yap, emin değilsen
               'şüpheli, elle kontrol et' de).
             - .env veya secret içerebilecek bir dosyanın repoya
               eklenip eklenmediğine bak.
          6. Bulgularını her ajan için tek satırlık durumla özetle:
             ✅ sorun yok / ⚠️ dikkat (ne) / 🚫 olası ihlal (ne).
          7. Sadece KENDİ klasörün olan maybeno-bekci-agent altındaki
             HATA-DEFTERI.md, SKILLS.md, hata-arsivi/*.md dosyalarına
             yaz — başka hiçbir dosyaya dokunma. Yeni bir ihlal veya
             ders bulduysan HATA-DEFTERI.md'ye anayasa.md §4 formatında
             ekle. HATA-DEFTERI.md ~200 satırı geçtiyse rotasyon yap
             (eski kısmı özetleyip hata-arsivi/YYYY-MM.md'ye taşı).
             Faydalı bir kontrol kısayolu keşfettiysen SKILLS.md'ye ekle.
          8. İşin sonunda mutlaka 'ÖZET:' başlıklı, en fazla 8 ajan
             satırı (kök proje-yönetim ajanı dahil) + varsa genel uyarı
             içeren kısa bir rapor yaz." \
            --dangerously-skip-permissions \
            --output-format json > bekci-log.json || true

      - name: Bellek dosyalarını commit'le
        run: |
          git add maybeno-bekci-agent/HATA-DEFTERI.md maybeno-bekci-agent/SKILLS.md maybeno-bekci-agent/hata-arsivi/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Bekci: haftalik denetim guncellemesi $(date +%Y-%m-%d)"
          git push origin HEAD:main || echo "Push edilecek değişiklik yok"

      - name: Log dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: bekci-log-${{ github.run_id }}
          path: bekci-log.json

      - name: Raporu Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(python3 -c "
          import json
          try:
              with open('bekci-log.json') as f:
                  data = json.load(f)
              text = ''
              if isinstance(data, dict):
                  text = data.get('result') or data.get('summary') or str(data)[:1500]
              elif isinstance(data, list):
                  text = ' '.join(str(x) for x in data)[:1500]
              print(text[:1800])
          except Exception as e:
              print(f'Log okunamadı: {e}')
          ")

          MESSAGE="🛡️ *Bekçi Denetim Raporu*
          $(date +%Y-%m-%d)

          $SUMMARY"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MESSAGE"
